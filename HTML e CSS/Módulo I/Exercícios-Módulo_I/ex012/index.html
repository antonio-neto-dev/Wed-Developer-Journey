<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado localmente no meu próprio servidor</p>

    <video width="600" autoplay loop>
        <source src="midias/videos/meu-video.mp4" type="video/mp4">
        <source src="midias/videos/meu-video.mkv" type="video/mkv">
        <source src="midias/videos/meu-video.webm" type="video/webm">
        <source src="midias/videos/meu-video.ogv" type="video/ogv">
        <p>Infelizmente seu navegador não conseguiu carregar o vídeo. <a href="midias/videos/meu-video.webm" download="meu-video.webm" type="video/webm">Clique aqui caso queira baixá-lo</a>.</p>
    </video>
</body>
</html>
